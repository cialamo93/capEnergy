<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%" fill="none">
  <!-- 1. Terrain Base (Left: Rocky Mountain, Right: Maritime Waves) -->
  <!-- Left: Rocky Mountains (Gray/Brown) -->
  <path d="M 10,135 L 50,110 L 85,135 H 10 Z" fill="#5A5D64" />
  <path d="M 32,135 L 50,110 L 68,135 H 32 Z" fill="#43464D" />
  
  <!-- Right: Overlapping Maritime Waves (Cyan & Blue) -->
  <path d="M 80,135 C 95,115 115,115 130,135 C 145,115 165,115 180,135 H 190 V 135 H 80 Z" fill="#0067F4" />
  <path d="M 95,135 C 110,122 125,122 140,135 C 155,122 170,122 185,135 H 190 V 135 H 95 Z" fill="#2BDBDC" />

  <!-- 2. Shining Headlamp Beam (From helmet lamp pointing down-left onto mountain) -->
  <polygon points="65,76 10,135 48,145" fill="#FBBF24" opacity="0.35" />

  <!-- 3. Mining Helmet (Orange, resting on the left mountain) -->
  <!-- Helmet Dome -->
  <path d="M 45,96 C 45,68 85,68 85,96 Z" fill="#F97316" stroke="#374151" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Helmet Visor/Brim -->
  <path d="M 39,96 C 39,96 65,103 91,96" stroke="#374151" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <!-- Helmet Rib (3D center crease) -->
  <path d="M 65,68 C 65,68 65,80 65,96" stroke="#D97706" stroke-width="3" />
  <!-- Helmet Lamp Base -->
  <rect x="60" y="72" width="10" height="8" rx="1.5" fill="#4B5563" stroke="#374151" stroke-width="2.5" />
  <!-- Helmet Lamp Light Glass -->
  <circle cx="65" cy="76" r="3" fill="#FFF066" />

  <!-- 4. Cargo Container Ship (On the right, floating on the waves) -->
  <!-- Funnel / Smokestack -->
  <rect x="122" y="94" width="4" height="8" fill="#374151" />
  <!-- Cabin structure (Bridge) -->
  <rect x="114" y="100" width="14" height="14" fill="#E5E7EB" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" />
  <rect x="118" y="103" width="6" height="4" fill="#0067F4" />
  
  <!-- Containers (stacked colorful boxes) -->
  <!-- Bottom row -->
  <rect x="129" y="112" width="12" height="8" rx="1" fill="#EF4444" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <rect x="142" y="112" width="12" height="8" rx="1" fill="#0067F4" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <rect x="155" y="112" width="12" height="8" rx="1" fill="#10B981" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <!-- Top row -->
  <rect x="135" y="104" width="12" height="8" rx="1" fill="#FBBF24" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <rect x="148" y="104" width="12" height="8" rx="1" fill="#8B5CF6" stroke="#374151" stroke-width="2" stroke-linejoin="round" />

  <!-- Ship Hull -->
  <polygon points="106,124 168,124 175,112 112,112" fill="#374151" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
</svg>