<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%" fill="none">
  <!-- Definition of the transparent mask for the sun cuts -->
  <defs>
    <mask id="sunMask">
      <!-- Everything white is fully opaque (visible) -->
      <rect x="0" y="0" width="200" height="200" fill="#ffffff" />
      
      <!-- Horizontal cutout lines (black is transparent) -->
      <!-- Left cutouts -->
      <rect x="15" y="45" width="28" height="7" rx="3.5" fill="#000000" />
      <rect x="10" y="65" width="38" height="7" rx="3.5" fill="#000000" />
      <rect x="25" y="85" width="20" height="7" rx="3.5" fill="#000000" />
      
      <!-- Right cutouts -->
      <rect x="145" y="55" width="25" height="7" rx="3.5" fill="#000000" />
      <rect x="135" y="75" width="35" height="7" rx="3.5" fill="#000000" />
      <rect x="140" y="95" width="30" height="7" rx="3.5" fill="#000000" />
      
      <!-- Single circular cutout in the sun -->
      <circle cx="92" cy="35" r="4.5" fill="#000000" />
    </mask>
  </defs>

  <!-- 1. Background Sun (Golden Yellow, masked to create transparent cloud slits) -->
  <circle cx="100" cy="75" r="55" fill="#FBBF24" mask="url(#sunMask)" />

  <!-- 2. Green Mountains (Vibrant green landscape base) -->
  <path d="M 15,135 L 55,108 C 58,105 62,105 65,108 L 90,126 L 130,93 C 133,90 137,90 140,93 L 185,130 H 15 Z" fill="#22C55E" />

  <!-- 3. Legs/Supports (Dark gray, in front of mountains but behind panel) -->
  <line x1="72" y1="95" x2="82" y2="135" stroke="#4B5563" stroke-width="12" stroke-linecap="round" />
  <line x1="102" y1="95" x2="112" y2="135" stroke="#4B5563" stroke-width="12" stroke-linecap="round" />

  <!-- 4. 3D Extrusion Side & Bottom (Dark gray edge) -->
  <polygon points="142,48 146,55 104,117 100,110" fill="#4B5563" />
  <polygon points="30,110 34,117 104,117 100,110" fill="#4B5563" />

  <!-- 5. Main Panel Face Frame (Light gray/white) -->
  <polygon points="30,110 72,48 142,48 100,110" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="3" stroke-linejoin="round" />

